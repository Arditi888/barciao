name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without a new commit.
  workflow_dispatch:

# Read the repo, and mint the token Pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings -> Pages -> Source is still "Deploy from a branch",
      # GitHub also runs its own "pages build and deployment" on every
      # push. That one publishes the repository ROOT, which is the
      # un-built Vite source, and whichever deployment finishes last is
      # the one that goes live. On 28 Aug 2026 the branch build finished
      # six seconds after this workflow and took the site down.
      #
      # Waiting here makes this deployment reliably the last one, so the
      # built site always wins the race.
      #
      # DELETE THIS STEP once Settings -> Pages -> Source is set to
      # "GitHub Actions" — the branch build stops running and the wait
      # becomes dead weight.
      - name: Wait out the legacy branch build
        run: sleep 90

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
