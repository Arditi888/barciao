<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evente – Bar Ciao</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0D1A40;
      --bg2:#1E3D75;
      --card:#34495e;
      --card-2:#2c3e50;
      --text:#ecf0f1;
      --muted:#bdc3c7;
      --accent:#f1c40f;
      --btn:#3D566E;
      --btn-hover:#48627c;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);overflow-x:hidden;text-align:center}
    .hero{padding:80px 20px 30px;animation:fadeIn 1.2s ease;}
    .hero h1{font-size:48px;margin:0 0 10px;font-family:'Playfair Display',serif;}
    .hero p{color:#dcdde1;margin:0}
    .controls{max-width:1000px;margin:24px auto 10px;padding:16px;display:grid;gap:12px;grid-template-columns:1fr;}
    @media(min-width:800px){.controls{grid-template-columns:1fr auto auto auto;}}
    .input,.button,.chip{background:var(--btn);color:var(--text);border:none;border-radius:10px;padding:12px 14px;font-size:16px;box-shadow:0 4px 8px rgba(0,0,0,.3)}
    .input{width:100%;text-align:left;outline:none}
    .button{cursor:pointer;transition:.25s;text-decoration:none;display:inline-block}
    .button:hover{background:var(--btn-hover);transform:translateY(-2px)}
    .chip{display:inline-flex;align-items:center;cursor:pointer;user-select:none;gap:8px;padding:10px 12px;background:var(--card)}
    .chip input{accent-color:var(--accent);width:18px;height:18px}
    .tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .grid{width:92%;max-width:1100px;margin:18px auto 30px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:var(--card);border-radius:14px;padding:18px;text-align:left;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:translateY(12px);opacity:0;animation:pop .5s forwards}
    .card h3{margin:0 0 6px;font-size:22px}
    .meta{font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
    .desc{font-size:14px;color:#e6e6e6;margin:10px 0 16px;}
    .pill{display:inline-block;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--card-2);border:1px solid rgba(255,255,255,.12);margin-right:6px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .price{color:var(--accent);font-weight:600;margin-left:auto}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .back{display:inline-block;margin:30px auto 10px}
    footer{margin:30px 0 20px;font-size:14px;color:#ccc;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)}}
    @keyframes pop{to{transform:translateY(0);opacity:1}}
    .date-badge{display:inline-grid;place-items:center;background:var(--card-2);border-radius:12px;width:64px;padding:6px 4px;margin-right:10px}
    .date-badge .day{font-size:20px;font-weight:700}
    .date-badge .mon{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .title-wrap{display:flex;align-items:center}
  </style>
</head>
<body>
  <div class="hero">
    <h1>Evente te Bar Ciao 🎉</h1>
    <p>Zgjidh, filtro dhe shtoji në kalendar – shihemi këtu!</p>
  </div>

  <div class="controls">
    <input id="search" class="input" placeholder="Kërko (p.sh. Juventus, DJ, verë)…"/>
    <label class="chip"><input id="onlyUpcoming" type="checkbox" checked /> Vetëm të ardhshme</label>
    <div class="tags">
      <label class="chip"><input type="checkbox" class="cat" value="sport" checked/> ⚽ Sport</label>
      <label class="chip"><input type="checkbox" class="cat" value="muzike" checked/> 🎵 Muzikë</label>
      <label class="chip"><input type="checkbox" class="cat" value="speciale" checked/> 🍷 Speciale</label>
    </div>
    <button id="reset" class="button">Reseto filtrat</button>
  </div>

  <div id="grid" class="grid"></div>

  <a href="index.html" class="button back">← Kthehu tek Faqja Kryesore</a>

  <footer>
    <p>© 2025 Bar Ciao. Të gjitha të drejtat e rezervuara.</p>
  </footer>

<script>
const DEFAULT_EVENTS = [
  {"id":"sample-1","title":"DJ Night: Italo & ABBA","desc":"Happy Hour 20:30–21:30.","location":"Bar Ciao","startISO":"2025-11-07T19:00:00.000Z","endISO":"2025-11-07T23:00:00.000Z","category":"muzike","price":"Hyrja falas","published":true}
];

const KEY = 'barciao_events';
const $ = sel => document.querySelector(sel);
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const onlyUpcoming = document.getElementById('onlyUpcoming');
const resetBtn = document.getElementById('reset');

function isUpcoming(ev){
  return new Date(ev.endISO || ev.startISO).getTime() >= Date.now();
}
function fmtDate(iso){
  const dt = new Date(iso);
  const day = String(dt.getDate()).padStart(2,'0');
  const mon = dt.toLocaleString('sq-AL',{month:'short'}).replace('.','');
  const time = dt.toLocaleTimeString('sq-AL',{hour:'2-digit',minute:'2-digit'});
  return {day, mon, time};
}
function toICSDate(iso){
  const dt = new Date(iso);
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth()+1).padStart(2,'0');
  const d = String(dt.getUTCDate()).padStart(2,'0');
  const h = String(dt.getUTCHours()).padStart(2,'0');
  const mi = String(dt.getUTCMinutes()).padStart(2,'0');
  const s = String(dt.getUTCSeconds()).padStart(2,'0');
  return `${y}${m}${d}T${h}${mi}${s}Z`;
}
function makeICS(ev){
  const ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Bar Ciao//Evente//SQ
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VEVENT
UID:${ev.id}@barciao
DTSTAMP:${toICSDate(new Date().toISOString())}
DTSTART:${toICSDate(ev.startISO)}
DTEND:${toICSDate(ev.endISO || ev.startISO)}
SUMMARY:${ev.title}
LOCATION:${ev.location||''}
DESCRIPTION:${ev.desc||''}
END:VEVENT
END:VCALENDAR`;
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  return URL.createObjectURL(blob);
}
function googleCalURL(ev){
  const base = 'https://www.google.com/calendar/render?action=TEMPLATE';
  const text = encodeURIComponent(ev.title);
  const dates = `${toICSDate(ev.startISO).replace('Z','')}Z/${toICSDate(ev.endISO || ev.startISO).replace('Z','')}Z`;
  const details = encodeURIComponent(ev.desc||'');
  const location = encodeURIComponent(ev.location||'');
  return `${base}&text=${text}&dates=${dates}&details=${details}&location=${location}`;
}
function card(ev, index){
  const {day, mon, time} = fmtDate(ev.startISO);
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.style.animationDelay = (index*70)+'ms';

  const img = ev.image ? `<img src="${ev.image}" alt="" style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin:6px 0 10px">` : '';

  const title = `
    <div class="title-wrap">
      <div class="date-badge"><div class="day">${day}</div><div class="mon">${mon}</div></div>
      <div>
        <h3>${ev.title}</h3>
        <div class="meta">
          <span>🕒 ${time}</span>
          ${ev.location ? `<span>📍 ${ev.location}</span>` : ''}
          <span class="pill">${ev.category==='sport'?'⚽ Sport':ev.category==='muzike'?'🎵 Muzikë':'🍷 Speciale'}</span>
          ${ev.price ? `<span class="pill price">${ev.price}</span>` : ''}
        </div>
      </div>
    </div>
  `;

  const desc = ev.desc ? `<p class="desc">${ev.desc}</p>` : '';

  const actions = document.createElement('div');
  actions.className = 'actions row';
  actions.innerHTML = `
    <a class="button" href="${makeICS(ev)}" download="${ev.id}.ics">Ruaj në kalendar (.ics)</a>
    <a class="button" target="_blank" rel="noopener" href="${googleCalURL(ev)}">Shto në Google Calendar</a>
  `;

  wrap.innerHTML = title + img + desc;
  wrap.appendChild(actions);
  return wrap;
}

function getPublishedList(list){
  const merged = Array.from(new Map(list.map(e=>[e.id||e.title,e])).values());
  return merged.filter(e => e.published).sort((a,b)=> new Date(a.startISO)-new Date(b.startISO));
}

async function loadFromRepoOrLocal(){
  // Try events.json at same path
  try{
    const res = await fetch('events.json', {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        return data;
      }
    }
  }catch(e){ /* ignore */ }

  // Fallback: localStorage
  try{
    const raw = localStorage.getItem(KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if(Array.isArray(arr) && arr.length) return arr;
  }catch(e){ /* ignore */ }

  // Fallback: defaults
  return DEFAULT_EVENTS;
}

const catChecksEls = Array.from(document.querySelectorAll('.cat'));
async function applyFilters(){
  const q = (search?.value || '').trim().toLowerCase();
  const onlyUp = !!(onlyUpcoming && onlyUpcoming.checked);
  const catOn = new Set(catChecksEls.filter(c=>c.checked).map(c=>c.value));

  const all = await loadFromRepoOrLocal();
  const base = getPublishedList(all);
  const filtered = base.filter(ev=>{
    if(onlyUp && !isUpcoming(ev)) return false;
    if(catOn.size && !catOn.has(ev.category)) return false;
    if(!q) return true;
    return (ev.title + ' ' + (ev.desc||'') + ' ' + (ev.location||'') + ' ' + (ev.price||''))
      .toLowerCase().includes(q);
  });

  grid.innerHTML = '';
  if(!filtered.length){
    const empty = document.createElement('div');
    empty.className='card';
    empty.innerHTML = `<h3>Nuk u gjet asnjë event</h3><p class="desc">Provo të ndryshosh filtrat ose kërkimin.</p>`;
    grid.appendChild(empty);
    return;
  }
  filtered.forEach((ev,i)=> grid.appendChild(card(ev,i)));
}

search?.addEventListener('input', applyFilters);
onlyUpcoming?.addEventListener('change', applyFilters);
catChecksEls.forEach(c=> c.addEventListener('change', applyFilters));
resetBtn?.addEventListener('click', ()=>{
  if(search) search.value='';
  if(onlyUpcoming) onlyUpcoming.checked = true;
  catChecksEls.forEach(c=> c.checked = true);
  applyFilters();
});

applyFilters();
</script>
</body>
</html>
