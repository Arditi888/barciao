<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orari i Barit</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0D1A40, #1E3D75);
      color: #ecf0f1;
      overflow-x: hidden;
      text-align: center;
    }

    .hero {
      padding: 80px 20px 40px;
      animation: fadeInHero 1.2s ease;
    }

    .hero h1 {
      font-size: 48px;
      font-family: 'Playfair Display', serif;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #dcdde1;
      margin-bottom: 40px;
    }

    .schedule {
      max-width: 600px;
      margin: 0 auto 40px;
      background-color: #34495e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-align: left;
    }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 20px;
      border-bottom: 1px solid #3d566e;
      padding-bottom: 10px;
    }

    .schedule-item:last-child {
      border-bottom: none;
    }

    .back-button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #3D566E;
      color: #ecf0f1;
      text-decoration: none;
      font-size: 18px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      margin-top: 40px;
    }

    .back-button:hover {
      background-color: #48627c;
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      color: #ccc;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
    }

    @keyframes fadeInHero {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Orari i Barit 🕒</h1>
    <p>Ejani dhe shijoni në oraret tona më të mira.</p>
  </div>

  <div class="schedule">
    <div class="schedule-item"><span>Hënë - E Premte</span> <span>08:00 - 23:00</span></div>
    <div class="schedule-item"><span>E Shtunë</span> <span>09:00 - 00:00</span></div>
    <div class="schedule-item"><span>E Dielë</span> <span>09:00 - 22:00</span></div>
  </div>

  <a href="index.html" class="back-button">← Kthehu tek Faqja Kryesore</a>

  <footer>
    <p>© 2025 Bar Ciao. Të gjitha të drejtat e rezervuara.</p>
  </footer>

</body>
</html>
